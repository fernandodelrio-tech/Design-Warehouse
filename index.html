    <!--
      DIRECTION CONTRACT — catalog wall

      THESIS: The tile is a picture. Every measurement is drawn onto the
      screenshot it came from, at its own scale, and only for the tile being
      attended to. It refuses the category default: a metadata card whose
      footer outweighs the image.

      OWN-WORLD: Unchanged. The measured ochre/cream world in global.css —
      borderless surface cards, --accent #e5d53b as fill and never as type,
      hairline #110000 rules, the system stack. This surface changes
      composition only; no new palette, type system, or material.

      STORY: Fernando scans a wall of 50-300 screenshots to decide which
      visual language fits what he is building. Palette and geometry decide
      it. He picks without opening anything.

      FIRST VIEWPORT: Masthead, filter row, then a fixed-height picture grid,
      four to six columns wide. Each tile is its screenshot, cropped from the
      top, with one hairline palette band across its foot and its name
      beneath. Attending to a tile paints the measurement sheet over the
      image: the measured radius as a real arc in the corner, the hairline as
      a real rule in its measured colour, the elevation as a real cast, the
      column count as rules across the design, each figure beside the thing it
      drew, each carrying its sample count. Nothing resizes; nothing displaces.
      The primary action is opening a tile.

      FORM: The Measured Overlay — first of seven grounded structures,
      dealt on the second hand. Surface scope, mode operate, code-led.
      Seed key 173026d1.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
