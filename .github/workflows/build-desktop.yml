name: Build desktop installer

# The Windows installer is produced here rather than locally: NSIS packaging
# needs a Windows toolchain, and this also keeps every release build identical.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft_release:
        description: Attach the installer to a draft release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the renderer
        run: npm run build

      - name: Package the installer
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no certificate here, and leaving discovery on makes
          # electron-builder fetch a large signing toolchain it will not use.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: design-warehouse-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft_release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
