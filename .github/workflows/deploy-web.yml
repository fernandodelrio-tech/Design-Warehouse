name: Deploy web app

# Publishes the built renderer to GitHub Pages, so the catalog is reachable
# from a browser on any machine as well as from the desktop app.
on:
  push:
    # The repository's default branch today, plus main for after any merge.
    branches:
      - main
      - claude/design-catalog-app-wgqj95
    paths-ignore:
      - '**.md'
      - .github/workflows/build-desktop.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest build is the one worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          # Self-enables Pages where the workflow token is allowed to; on many
          # repositories it is not, which the next step explains rather than
          # leaving a bare "Resource not accessible by integration".
          enablement: true

      - name: Explain how to switch Pages on
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
          {
            echo "## GitHub Pages needs turning on"
            echo
            echo "This workflow builds fine, but it cannot publish until Pages is enabled,"
            echo "and the workflow token is not permitted to enable it for you."
            echo
            echo "One-time setup:"
            echo
            echo "1. Open **Settings -> Pages** in this repository."
            echo "2. Under **Build and deployment**, set **Source** to **GitHub Actions**."
            echo "3. Re-run this workflow."
            echo
            echo "The app will then be published to:"
            echo
            echo '```'
            echo "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
