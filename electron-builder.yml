appId: com.designwarehouse.app
productName: Design Warehouse
copyright: Design Warehouse

directories:
  output: release
  buildResources: build

# Only the built renderer and the shell go into the package; the React source,
# the icon generator and the dev dependencies stay out.
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - package.json
  - '!**/*.map'

# Nothing here needs a native module, so the default rebuild step is wasted work.
npmRebuild: false

win:
  icon: build/icon.ico
  artifactName: ${productName} ${version} Setup.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  # Per-user install: no administrator prompt, and the catalog stays with the
  # account that created it.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Design Warehouse
  deleteAppDataOnUninstall: false
  runAfterFinish: true

portable:
  artifactName: ${productName} ${version} Portable.${ext}

linux:
  icon: build/icon.png
  category: Graphics
  artifactName: ${productName} ${version}.${ext}
  target:
    - AppImage
